# Prometheus + Grafana for the API's /metrics, for local use or as a starting
# point. Not exercised in CI. See README.md.
#
#   echo -n "$METRICS_TOKEN" > prometheus/metrics_token   # the API's token
#   docker compose -f infra/observability/docker-compose.yml up -d
#   open http://localhost:3001   (Grafana, admin / admin)
name: installment-observability

services:
  prometheus:
    image: prom/prometheus:v2.53.2
    ports: ['9090:9090']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports: ['3001:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
