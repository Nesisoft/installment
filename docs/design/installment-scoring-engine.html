<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scoring Rules Engine — Architecture & Flow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1419;
    color: #e6e6e6;
    padding: 32px;
    min-height: 100vh;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #fff;
  }
  .subtitle {
    font-size: 13px;
    color: #8b95a3;
    margin-bottom: 28px;
  }
  .canvas {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 28px;
    overflow-x: auto;
    margin-bottom: 24px;
  }
  svg { display: block; margin: 0 auto; }
  .legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
    font-size: 12px;
    color: #8b95a3;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
  }
</style>
</head>
<body>
  <h1>Scoring Rules Engine — Architecture & Flow</h1>
  <p class="subtitle">Signal collection · rule evaluation · risk banding · decision output</p>

  <div class="canvas">
    <svg width="1180" height="780" viewBox="0 0 1180 780" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#5b8def"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#4ec9a8"/>
        </marker>
        <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#d4a93a"/>
        </marker>
      </defs>

      <!-- ============ TRIGGER ============ -->
      <text x="40" y="40" font-size="11" font-weight="600" fill="#8b95a3" letter-spacing="1.5">TRIGGER</text>
      <line x1="40" y1="48" x2="1140" y2="48" stroke="#30363d" stroke-width="1"/>

      <rect x="450" y="60" width="280" height="60" rx="8" fill="#1e3a5f" stroke="#5b8def" stroke-width="1.5"/>
      <text x="590" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Application Submitted</text>
      <text x="590" y="104" text-anchor="middle" font-size="11" fill="#a8c0e0">customer_id, merchant_id, order_amount, plan_template_id</text>

      <!-- ============ SIGNAL COLLECTION ============ -->
      <text x="40" y="160" font-size="11" font-weight="600" fill="#8b95a3" letter-spacing="1.5">SIGNAL COLLECTORS — parallel, cached, fail-soft</text>
      <line x1="40" y1="168" x2="1140" y2="168" stroke="#30363d" stroke-width="1"/>

      <!-- 6 collectors in a row -->
      <rect x="60" y="185" width="170" height="100" rx="8" fill="#1a2e3a" stroke="#5b8def" stroke-width="1.5"/>
      <text x="145" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Identity</text>
      <text x="145" y="226" text-anchor="middle" font-size="10" fill="#a8c0e0">Ghana Card status</text>
      <text x="145" y="240" text-anchor="middle" font-size="10" fill="#a8c0e0">Verified phone</text>
      <text x="145" y="254" text-anchor="middle" font-size="10" fill="#a8c0e0">Address proof</text>
      <text x="145" y="268" text-anchor="middle" font-size="10" fill="#a8c0e0">KYC tier</text>

      <rect x="240" y="185" width="170" height="100" rx="8" fill="#1a2e3a" stroke="#5b8def" stroke-width="1.5"/>
      <text x="325" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Repayment History</text>
      <text x="325" y="226" text-anchor="middle" font-size="10" fill="#a8c0e0">Past plans count</text>
      <text x="325" y="240" text-anchor="middle" font-size="10" fill="#a8c0e0">On-time rate</text>
      <text x="325" y="254" text-anchor="middle" font-size="10" fill="#a8c0e0">Days-past-due avg</text>
      <text x="325" y="268" text-anchor="middle" font-size="10" fill="#a8c0e0">Prior defaults</text>

      <rect x="420" y="185" width="170" height="100" rx="8" fill="#1a2e3a" stroke="#5b8def" stroke-width="1.5"/>
      <text x="505" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Payment Behavior</text>
      <text x="505" y="226" text-anchor="middle" font-size="10" fill="#a8c0e0">Paystack txn count</text>
      <text x="505" y="240" text-anchor="middle" font-size="10" fill="#a8c0e0">MoMo vs card mix</text>
      <text x="505" y="254" text-anchor="middle" font-size="10" fill="#a8c0e0">Avg txn value</text>
      <text x="505" y="268" text-anchor="middle" font-size="10" fill="#a8c0e0">Failed-charge rate</text>

      <rect x="600" y="185" width="170" height="100" rx="8" fill="#1a2e3a" stroke="#5b8def" stroke-width="1.5"/>
      <text x="685" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Tenure</text>
      <text x="685" y="226" text-anchor="middle" font-size="10" fill="#a8c0e0">Account age</text>
      <text x="685" y="240" text-anchor="middle" font-size="10" fill="#a8c0e0">Phone number age</text>
      <text x="685" y="254" text-anchor="middle" font-size="10" fill="#a8c0e0">Device fingerprint</text>
      <text x="685" y="268" text-anchor="middle" font-size="10" fill="#a8c0e0">Login frequency</text>

      <rect x="780" y="185" width="170" height="100" rx="8" fill="#1a2e3a" stroke="#5b8def" stroke-width="1.5"/>
      <text x="865" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Employment</text>
      <text x="865" y="226" text-anchor="middle" font-size="10" fill="#a8c0e0">Employer linked?</text>
      <text x="865" y="240" text-anchor="middle" font-size="10" fill="#a8c0e0">Salary band</text>
      <text x="865" y="254" text-anchor="middle" font-size="10" fill="#a8c0e0">Tenure months</text>
      <text x="865" y="268" text-anchor="middle" font-size="10" fill="#a8c0e0">Payroll consent</text>

      <rect x="960" y="185" width="170" height="100" rx="8" fill="#1a2e3a" stroke="#5b8def" stroke-width="1.5"/>
      <text x="1045" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Exposure</text>
      <text x="1045" y="226" text-anchor="middle" font-size="10" fill="#a8c0e0">Active plans count</text>
      <text x="1045" y="240" text-anchor="middle" font-size="10" fill="#a8c0e0">Outstanding balance</text>
      <text x="1045" y="254" text-anchor="middle" font-size="10" fill="#a8c0e0">Utilization %</text>
      <text x="1045" y="268" text-anchor="middle" font-size="10" fill="#a8c0e0">Limit headroom</text>

      <!-- arrows down -->
      <line x1="590" y1="120" x2="145" y2="185" stroke="#5b8def" stroke-width="1" marker-end="url(#arrow-blue)"/>
      <line x1="590" y1="120" x2="325" y2="185" stroke="#5b8def" stroke-width="1" marker-end="url(#arrow-blue)"/>
      <line x1="590" y1="120" x2="505" y2="185" stroke="#5b8def" stroke-width="1" marker-end="url(#arrow-blue)"/>
      <line x1="590" y1="120" x2="685" y2="185" stroke="#5b8def" stroke-width="1" marker-end="url(#arrow-blue)"/>
      <line x1="590" y1="120" x2="865" y2="185" stroke="#5b8def" stroke-width="1" marker-end="url(#arrow-blue)"/>
      <line x1="590" y1="120" x2="1045" y2="185" stroke="#5b8def" stroke-width="1" marker-end="url(#arrow-blue)"/>

      <!-- ============ FEATURE VECTOR ============ -->
      <text x="40" y="320" font-size="11" font-weight="600" fill="#8b95a3" letter-spacing="1.5">NORMALIZED FEATURE VECTOR</text>
      <line x1="40" y1="328" x2="1140" y2="328" stroke="#30363d" stroke-width="1"/>

      <rect x="180" y="340" width="820" height="55" rx="8" fill="#1f2d3d" stroke="#4a6a8a" stroke-width="1.5"/>
      <text x="590" y="361" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">FeatureVector — typed object passed to all rules</text>
      <text x="590" y="380" text-anchor="middle" font-size="10" fill="#a8c0e0">{ identity: {...}, repayment: {...}, behavior: {...}, tenure: {...}, employment: {...}, exposure: {...} }</text>

      <line x1="145" y1="285" x2="280" y2="340" stroke="#4a6a8a" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-blue)"/>
      <line x1="1045" y1="285" x2="900" y2="340" stroke="#4a6a8a" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-blue)"/>

      <!-- ============ RULES ENGINE ============ -->
      <text x="40" y="430" font-size="11" font-weight="600" fill="#8b95a3" letter-spacing="1.5">RULES ENGINE — ordered, declarative, versioned</text>
      <line x1="40" y1="438" x2="1140" y2="438" stroke="#30363d" stroke-width="1"/>

      <!-- Stage 1: Hard gates -->
      <rect x="60" y="455" width="320" height="160" rx="8" fill="#3a1f1f" stroke="#e07b7b" stroke-width="1.5"/>
      <text x="220" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Stage 1 — Hard Gates</text>
      <text x="220" y="494" text-anchor="middle" font-size="10" fill="#e0b8b8" font-style="italic">any fail → decline immediately</text>
      <line x1="80" y1="505" x2="360" y2="505" stroke="#e07b7b" stroke-width="0.5" opacity="0.4"/>
      <text x="80" y="524" font-size="10" fill="#e0b8b8">• Ghana Card verified</text>
      <text x="80" y="540" font-size="10" fill="#e0b8b8">• Phone number ≥ 30 days old</text>
      <text x="80" y="556" font-size="10" fill="#e0b8b8">• No active default within 12 months</text>
      <text x="80" y="572" font-size="10" fill="#e0b8b8">• Order amount within plan template min/max</text>
      <text x="80" y="588" font-size="10" fill="#e0b8b8">• Not on internal blocklist / sanctions</text>
      <text x="80" y="604" font-size="10" fill="#e0b8b8">• Age ≥ 18, ≤ 70</text>

      <!-- Stage 2: Scoring rules -->
      <rect x="410" y="455" width="320" height="160" rx="8" fill="#3a2e1a" stroke="#d4a93a" stroke-width="1.5"/>
      <text x="570" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Stage 2 — Weighted Score</text>
      <text x="570" y="494" text-anchor="middle" font-size="10" fill="#e0c890" font-style="italic">accumulates points 0–1000</text>
      <line x1="430" y1="505" x2="710" y2="505" stroke="#d4a93a" stroke-width="0.5" opacity="0.4"/>
      <text x="430" y="524" font-size="10" fill="#e0c890">• Repayment history (40%)</text>
      <text x="430" y="540" font-size="10" fill="#e0c890">• Payment behavior (20%)</text>
      <text x="430" y="556" font-size="10" fill="#e0c890">• Tenure / engagement (15%)</text>
      <text x="430" y="572" font-size="10" fill="#e0c890">• Employment / payroll (15%)</text>
      <text x="430" y="588" font-size="10" fill="#e0c890">• Identity completeness (10%)</text>
      <text x="430" y="604" font-size="10" fill="#e0c890" font-style="italic">weights stored in config</text>

      <!-- Stage 3: Exposure caps -->
      <rect x="760" y="455" width="370" height="160" rx="8" fill="#2e1a3a" stroke="#a07cc5" stroke-width="1.5"/>
      <text x="945" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Stage 3 — Exposure & Affordability</text>
      <text x="945" y="494" text-anchor="middle" font-size="10" fill="#c5a8d8" font-style="italic">caps based on risk band</text>
      <line x1="780" y1="505" x2="1110" y2="505" stroke="#a07cc5" stroke-width="0.5" opacity="0.4"/>
      <text x="780" y="524" font-size="10" fill="#c5a8d8">• Max total outstanding by risk band</text>
      <text x="780" y="540" font-size="10" fill="#c5a8d8">• Max concurrent active plans (typically 3)</text>
      <text x="780" y="556" font-size="10" fill="#c5a8d8">• Installment vs estimated income ratio</text>
      <text x="780" y="572" font-size="10" fill="#c5a8d8">• Merchant category caps (electronics vs fashion)</text>
      <text x="780" y="588" font-size="10" fill="#c5a8d8">• Velocity check: applications in last 24h</text>
      <text x="780" y="604" font-size="10" fill="#c5a8d8">• Counter-offer if amount exceeds cap</text>

      <!-- Stage flow arrows -->
      <line x1="380" y1="535" x2="410" y2="535" stroke="#d4a93a" stroke-width="2" marker-end="url(#arrow-amber)"/>
      <line x1="730" y1="535" x2="760" y2="535" stroke="#a07cc5" stroke-width="2" marker-end="url(#arrow-amber)"/>

      <!-- ============ DECISION ============ -->
      <text x="40" y="650" font-size="11" font-weight="600" fill="#8b95a3" letter-spacing="1.5">DECISION OUTPUT</text>
      <line x1="40" y1="658" x2="1140" y2="658" stroke="#30363d" stroke-width="1"/>

      <rect x="60" y="670" width="200" height="80" rx="8" fill="#1a3a2e" stroke="#4ec9a8" stroke-width="2"/>
      <text x="160" y="694" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">APPROVED</text>
      <text x="160" y="712" text-anchor="middle" font-size="10" fill="#90e0c0">score ≥ 700</text>
      <text x="160" y="728" text-anchor="middle" font-size="10" fill="#90e0c0">prime band</text>
      <text x="160" y="742" text-anchor="middle" font-size="10" fill="#90e0c0">full terms offered</text>

      <rect x="280" y="670" width="200" height="80" rx="8" fill="#1a3a2e" stroke="#4ec9a8" stroke-width="1.5"/>
      <text x="380" y="694" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">APPROVED — Tier 2</text>
      <text x="380" y="712" text-anchor="middle" font-size="10" fill="#90e0c0">score 500–699</text>
      <text x="380" y="728" text-anchor="middle" font-size="10" fill="#90e0c0">near-prime band</text>
      <text x="380" y="742" text-anchor="middle" font-size="10" fill="#90e0c0">reduced limit, larger down payment</text>

      <rect x="500" y="670" width="200" height="80" rx="8" fill="#3a2e1a" stroke="#d4a93a" stroke-width="1.5"/>
      <text x="600" y="694" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">COUNTER-OFFER</text>
      <text x="600" y="712" text-anchor="middle" font-size="10" fill="#e0c890">amount or term changed</text>
      <text x="600" y="728" text-anchor="middle" font-size="10" fill="#e0c890">e.g. higher down payment</text>
      <text x="600" y="742" text-anchor="middle" font-size="10" fill="#e0c890">customer accepts/rejects</text>

      <rect x="720" y="670" width="200" height="80" rx="8" fill="#2e1a3a" stroke="#a07cc5" stroke-width="1.5"/>
      <text x="820" y="694" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">MANUAL REVIEW</text>
      <text x="820" y="712" text-anchor="middle" font-size="10" fill="#c5a8d8">score 350–499 OR</text>
      <text x="820" y="728" text-anchor="middle" font-size="10" fill="#c5a8d8">high-value first-timer</text>
      <text x="820" y="742" text-anchor="middle" font-size="10" fill="#c5a8d8">operator decides</text>

      <rect x="940" y="670" width="190" height="80" rx="8" fill="#3a1f1f" stroke="#e07b7b" stroke-width="2"/>
      <text x="1035" y="694" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">DECLINED</text>
      <text x="1035" y="712" text-anchor="middle" font-size="10" fill="#e0b8b8">hard gate failed</text>
      <text x="1035" y="728" text-anchor="middle" font-size="10" fill="#e0b8b8">OR score &lt; 350</text>
      <text x="1035" y="742" text-anchor="middle" font-size="10" fill="#e0b8b8">reason returned</text>

      <!-- ============ PERSISTENCE ============ -->
      <line x1="220" y1="615" x2="160" y2="670" stroke="#4ec9a8" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <line x1="570" y1="615" x2="380" y2="670" stroke="#4ec9a8" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <line x1="945" y1="615" x2="600" y2="670" stroke="#d4a93a" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
      <line x1="945" y1="615" x2="820" y2="670" stroke="#a07cc5" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
      <line x1="220" y1="615" x2="1035" y2="670" stroke="#e07b7b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
    </svg>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch" style="background:#1a2e3a;border-color:#5b8def"></span>Signal collectors</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#3a1f1f;border-color:#e07b7b"></span>Hard gates (decline on fail)</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#3a2e1a;border-color:#d4a93a"></span>Weighted scoring</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#2e1a3a;border-color:#a07cc5"></span>Exposure & affordability</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#1a3a2e;border-color:#4ec9a8"></span>Approval outcomes</div>
    </div>
  </div>
</body>
</html>
